<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Love 🪐💖</title>
    <!-- Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #d81b60;
            --secondary-color: #f48fb1;
            --bg-color: #ffebee;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-color: #880e4f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kantumruy Pro', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Top Header */
        header {
            background-color: #fff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .music-bar {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .music-title {
            font-size: 14px;
            font-weight: 600;
            max-width: 250px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .play-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: transform 0.2s, background 0.2s;
            z-index: 1010;
        }

        .play-btn:hover {
            transform: scale(1.1);
            background-color: #ad1457;
        }

        /* Navigation Bar */
        nav {
            background-color: var(--primary-color);
            display: flex;
            justify-content: center;
            padding: 12px;
            gap: 20px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: background 0.3s;
        }

        nav a:hover, nav a.active {
            background-color: white;
            color: var(--primary-color);
        }

        /* Content Area */
        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(216, 27, 96, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.7);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .card h2 {
            font-size: 22px;
            margin-bottom: 25px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Custom File Upload Styling */
        .upload-section {
            margin-bottom: 25px;
            text-align: left;
        }

        .upload-label {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 10px;
            display: block;
            text-align: center;
        }

        .file-drop-area {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 30px;
            border: 2px dashed var(--secondary-color);
            border-radius: 15px;
            background-color: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
        }

        .file-drop-area:hover {
            background-color: rgba(244, 143, 177, 0.15);
            border-color: var(--primary-color);
        }

        .file-drop-area i {
            font-size: 40px;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .file-input {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-msg {
            font-size: 14px;
            color: var(--text-color);
            text-align: center;
            line-height: 1.5;
            word-break: break-all;
        }

        /* Falling Elements */
        .falling-element {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            font-size: 24px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        footer {
            text-align: center;
            padding: 30px;
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-color);
            margin-top: 50px;
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Audio Element -->
    <audio id="bg-music" loop preload="auto"></audio>

    <!-- Top Header -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-heart-pulse"></i> Deep Love
        </div>
        <div class="music-bar">
            <span class="music-title" id="current-track-name">គ្មានបទចម្រៀងត្រូវបានជ្រើសរើសទេ</span>
            <button class="play-btn" id="music-control-btn">
                <i class="fa-solid fa-play" id="play-icon"></i>
            </button>
        </div>
    </header>

    <!-- Navigation Bar -->
    <nav>
        <a href="index.html"><i class="fa-solid fa-house"></i> ទំព័រដើម</a>
        <a href="#"><i class="fa-solid fa-image"></i> ផ្ទាំងរូបថត</a>
        <a href="#"><i class="fa-solid fa-envelope"></i> សំបុត្រអនាគត</a>
        <a href="#"><i class="fa-solid fa-calendar-days"></i> គម្រោង&ប្រាថ្នា</a>
        <a href="index.html" class="active"><i class="fa-solid fa-gear"></i> កំណត់រចនា</a>
    </nav>

    <!-- Content Area -->
    <div class="container">
        <div class="card">
            <h2><i class="fa-solid fa-sliders"></i> កំណត់រចនាវេបសាយ និងតន្ត្រី</h2>
            
            <!-- Audio File Upload Section -->
            <div class="upload-section">
                <label class="upload-label">ផ្លាស់ប្តូរតន្ត្រីផ្ទៃក្រោយ (ជ្រើសរើសឯកសារ .mp3)៖</label>
                <div class="file-drop-area">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span class="file-msg" id="file-status-text">សូមចុចទីនេះ ដើម្បី Upload បទចម្រៀងពីឧបករណ៍របស់អ្នក</span>
                    <input type="file" class="file-input" id="audio-file-picker" accept="audio/mp3, audio/*">
                </div>
            </div>

            <p style="font-size: 13px; color: #ad1457; margin-top: 15px;">អរគុណប្អូនស្រីសម្រាប់ការបង្កើតពិភពដី៍អស្ចារ្យមួយនេះ! 🥂</p>
        </div>
    </div>

    <!-- Floating Background Icons -->
    <script>
        const emojis = ['🌸', '💖', '🌹', '🪐', '🐱', '🐰', '✨'];
        function createFallingElement() {
            const element = document.createElement('div');
            element.classList.add('falling-element');
            element.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            element.style.left = Math.random() * 100 + "vw";
            element.style.animationDuration = Math.random() * 3 + 4 + "s";
            element.style.fontSize = Math.random() * 15 + 15 + "px";
            document.body.appendChild(element);
            
            setTimeout(() => {
                element.remove();
            }, 7000);
        }
        setInterval(createFallingElement, 400);
    </script>

    <!-- Music Player Controller Script -->
    <script>
        const audio = document.getElementById('bg-music');
        const playBtn = document.getElementById('music-control-btn');
        const playIcon = document.getElementById('play-icon');
        const trackNameDisplay = document.getElementById('current-track-name');
        const fileStatusText = document.getElementById('file-status-text');
        const filePicker = document.getElementById('audio-file-picker');

        // 1. Load saved audio from localStorage on page load
        const savedAudio = localStorage.getItem('custom_bg_music');
        const savedAudioName = localStorage.getItem('custom_bg_music_name');
        
        if (savedAudio && savedAudioName) {
            audio.src = savedAudio;
            trackNameDisplay.innerText = savedAudioName;
            fileStatusText.innerHTML = "បទចម្រៀងបច្ចុប្បន្ន៖<br><strong>" + savedAudioName + "</strong>";
        }

        // 2. Toggle Play/Pause Function
        function toggleMusic() {
            if (!audio.src) {
                alert("សូមមេត្តា Upload បទចម្រៀងជាមុនសិនចា៎!");
                return;
            }
            
            if (audio.paused) {
                audio.play().then(() => {
                    playIcon.className = "fa-solid fa-pause";
                }).catch(err => {
                    alert("មិនអាចលេងបានទេ! សូមសាកល្បងចុចម្តងទៀត។");
                });
            } else {
                audio.pause();
                playIcon.className = "fa-solid fa-play";
            }
        }

        // Assign toggle event to the big pink button
        playBtn.addEventListener('click', toggleMusic);

        // 3. Handle File Upload
        filePicker.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                trackNameDisplay.innerText = "កំពុងរៀបចំបទចម្រៀង...";
                fileStatusText.innerText = "កំពុងដំណើរការឯកសារ...";

                const reader = new FileReader();
                reader.onload = function(e) {
                    const audioUrl = e.target.result;
                    
                    try {
                        // Save to localStorage
                        localStorage.setItem('custom_bg_music', audioUrl);
                        localStorage.setItem('custom_bg_music_name', file.name);
                        
                        // Set and Play
                        audio.src = audioUrl;
                        trackNameDisplay.innerText = file.name;
                        fileStatusText.innerHTML = "បានបញ្ចូលជោគជ័យ! 🎉<br><strong>" + file.name + "</strong>";
                        
                        // Force play directly after user interaction
                        audio.play().then(() => {
                            playIcon.className = "fa-solid fa-pause";
                        }).catch(e => {
                            playIcon.className = "fa-solid fa-play";
                        });

                    } catch (error) {
                        alert("ទំហំបទចម្រៀងធំពេក! យោងតាមច្បាប់របស់ Browser សូមជ្រើសរើសបទចម្រៀងណាដែលមានទំហំតូចជាង 4MB ឬ 5MB ចា៎។");
                        trackNameDisplay.innerText = "គ្មានបទចម្រៀងត្រូវបានជ្រើសរើសទេ";
                        fileStatusText.innerText = "សូមសាកល្បងជាមួយបទចម្រៀងផ្សេងទៀត";
                    }
                };
                reader.readAsDataURL(file);
            }
        });

        // Enable global click to unlock audio if blocked by browser
        document.body.addEventListener('click', function() {
            if (audio.src && audio.paused && playIcon.className === "fa-solid fa-pause") {
                audio.play().catch(() => {});
            }
        }, { once: true });
    </script>

    <footer>
        Created with ❤️ by Sister & Gemini 2026 🪐
    </footer>
</body>
</html>
